services:
  postgres:
    image: postgres:16-alpine
    container_name: sedcm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sedcm-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 -W 2 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sedcm-backend
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      HTTP_PORT: 3000
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_CLIENT_ID: backend-sedcm-docker
      MQTT_CONNECT_TIMEOUT_MS: 5000
      MQTT_RECONNECT_PERIOD_MS: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGSSLMODE: disable
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ESCALATION_GRACE_MS: 30000
      OFFLINE_TIMEOUT_MS: 30000
      OFFLINE_SWEEP_INTERVAL_MS: 10000
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  edge-agent-a1-n1:
    build:
      context: ../../edge-agent
      dockerfile: Dockerfile
    container_name: sedcm-edge-agent-a1-n1
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      EDGE_ZONE: A
      EDGE_RACK: A1
      NODE_ID: N1
      EXECUTOR_ID: executor-A1-N1
      NODE_INTERVAL_S: 5
      ENV_INTERVAL_S: 10
      ACK_DELAY_S: 0.5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  edge-agent-a1-n2:
    build:
      context: ../../edge-agent
      dockerfile: Dockerfile
    container_name: sedcm-edge-agent-a1-n2
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      EDGE_ZONE: A
      EDGE_RACK: A1
      NODE_ID: N2
      EXECUTOR_ID: executor-A1-N2
      NODE_INTERVAL_S: 5
      ENV_INTERVAL_S: 10
      ACK_DELAY_S: 0.5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  edge-agent-a2-n3:
    build:
      context: ../../edge-agent
      dockerfile: Dockerfile
    container_name: sedcm-edge-agent-a2-n3
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      EDGE_ZONE: A
      EDGE_RACK: A2
      NODE_ID: N3
      EXECUTOR_ID: executor-A2-N3
      NODE_INTERVAL_S: 5
      ENV_INTERVAL_S: 10
      ACK_DELAY_S: 0.5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  edge-agent-a2-n4:
    build:
      context: ../../edge-agent
      dockerfile: Dockerfile
    container_name: sedcm-edge-agent-a2-n4
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      EDGE_ZONE: A
      EDGE_RACK: A2
      NODE_ID: N4
      EXECUTOR_ID: executor-A2-N4
      NODE_INTERVAL_S: 5
      ENV_INTERVAL_S: 10
      ACK_DELAY_S: 0.5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
